name: zork_dude
description: "Mist Tower RPG - Flutter mobile client for Zork Dude"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/ending/
    - assets/images/exploration/
    - assets/images/fx/
    - assets/images/ui/
    - assets/ui/
    - assets/data/items.json
    - assets/data/monsters.json
    - assets/data/npcs.json
    - assets/data/companions.json
    - assets/data/rooms.json
    - assets/data/status_effects.json
