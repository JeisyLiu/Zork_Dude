name: zork_dude
description: "Mist Tower RPG - Flutter mobile client for Zork Dude"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.3
  games_services: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/ending/
    - assets/images/exploration/
    - assets/images/fx/
    - assets/images/ui/
    - assets/ui/
    - assets/l10n/messages/
    - assets/data/l10n/zh_Hans/
    - assets/data/l10n/zh_Hant/
    - assets/data/l10n/en_US/
    - assets/data/l10n/ja/
    - assets/data/l10n/ko/
    - assets/data/l10n/fr/
    - assets/data/l10n/de/
    - assets/data/l10n/it/
    - assets/data/l10n/es_ES/
    - assets/data/l10n/pt_BR/
    - assets/data/items.json
    - assets/data/monsters.json
    - assets/data/npcs.json
    - assets/data/companions.json
    - assets/data/rooms.json
    - assets/data/status_effects.json
